<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PIXEL DRIFT - Corrida</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#111;color:#fff;font-family:monospace;overflow:hidden;touch-action:none}
#top{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:#000}
#top h1{font-size:18px;color:#ffe600;text-shadow:2px 2px 0 #f00}
button{font-family:monospace;font-weight:bold;cursor:pointer}
#fullBtn{background:#ffe600;border:2px solid #fff;padding:8px 10px;border-radius:8px}
#gameWrap{position:relative;width:100%;height:calc(100dvh - 52px);background:#222;display:flex;justify-content:center}
canvas{background:#2e8b57;max-width:100%;height:100%;image-rendering:pixelated;border-left:4px solid #fff;border-right:4px solid #fff}
#menu{position:absolute;inset:0;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:15px;z-index:10}
#menu h2{font-size:28px;color:#ffe600}
#cars{display:flex;gap:10px}
.carOpt{width:60px;height:90px;border:4px solid #555;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:30px;background:#333}
.carOpt.sel{border-color:#ffe600;transform:scale(1.1)}
#startBtn{background:#00e676;color:#000;font-size:20px;padding:14px 28px;border:3px solid #fff;border-radius:12px}
#hud{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);padding:6px 12px;border-radius:10px;font-size:14px;white-space:nowrap;z-index:5}
#controls{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:space-between;padding:0 10px;z-index:5;pointer-events:none}
#controls button{pointer-events:auto;width:64px;height:64px;border-radius:50%;border:3px solid #fff;font-size:26px;background:rgba(255,255,255,.9);color:#000}
#controls button:active{background:#ffe600}
#gas{background:#00e676 !important}
#brake{background:#ff1744 !important;color:#fff !important}
#msg{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);font-size:26px;background:#000;padding:10px 18px;border:3px solid #ffe600;border-radius:12px;display:none;z-index:6}
</style>
</head>
<body>
<div id="top"><h1>🏁 PIXEL DRIFT 2.0</h1><button id="fullBtn" onclick="toggleFull()">⛶ TELA CHEIA</button></div>
<div id="gameWrap">
<canvas id="game" width="360" height="520"></canvas>
<div id="hud">POS: <span id="pos">4/4</span> | VOLTA: <span id="lap">1/3</span> | VEL: <span id="vel">0</span></div>
<div id="msg"></div>
<div id="menu">
<h2>PIXEL DRIFT</h2>
<p>Escolha seu carro:</p>
<div id="cars">
<div class="carOpt sel" data-c="0" data-color="#ff1744" onclick="pickCar(this)">🚗</div>
<div class="carOpt" data-c="1" data-color="#2979ff" onclick="pickCar(this)">🚙</div>
<div class="carOpt" data-c="2" data-color="#ffe600" onclick="pickCar(this)">🚕</div>
<div class="carOpt" data-c="3" data-color="#00e676" onclick="pickCar(this)">🏎️</div>
</div>
<p>⬅️ ➡️ = Virar &nbsp; | &nbsp; 🟢 = Acelerar &nbsp; | &nbsp; 🔴 = Freio</p>
<p>3 voltas! Ultrapasse todo mundo!</p>
<button id="startBtn" onclick="startGame()">▶️ COMEÇAR CORRIDA</button>
</div>
<div id="controls">
<div style="display:flex;gap:10px"><button id="left">⬅️</button><button id="right">➡️</button></div>
<div style="display:flex;gap:10px"><button id="brake">🔴</button><button id="gas">🟢</button></div>
</div>
</div>
<script>
let canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let playerColor='#ff1744',playing=false,keys={};
let player,opps=[],roadY=0,lap=1,totalLaps=3,finish=false,raceTime=0;
function pickCar(el){document.querySelectorAll('.carOpt').forEach(c=>c.classList.remove('sel'));el.classList.add('sel');playerColor=el.dataset.color;}
function toggleFull(){if(!document.fullscreenElement){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();}else{document.exitFullscreen&&document.exitFullscreen();}}
function startGame(){
 playing=true;finish=false;lap=1;raceTime=0;roadY=0;
 player={x:180,y:420,w:36,h:60,speed:0,color:playerColor,dist:0};
 let colors=['#2979ff','#ffe600','#00e676','#ff6d00','#e040fb'];
 opps=[];
 for(let i=0;i<3;i++){opps.push({x:70+i*90,y:100+i*70,w:36,h:60,speed:3+Math.random()*1.5,color:colors[i],dist:100+i*50,change:0});}
 document.getElementById('menu').style.display='none';
 document.getElementById('msg').style.display='none';
}
function drawCar(x,y,w,h,color,isPlayer){
 ctx.fillStyle='#000';ctx.fillRect(x-3,y-3,w+6,h+6);
 ctx.fillStyle=color;ctx.fillRect(x,y,w,h);
 ctx.fillStyle='#111';ctx.fillRect(x+5,y+8,w-10,12);ctx.fillRect(x+5,y+35,w-10,12);
 ctx.fillStyle='#fff';ctx.fillRect(x+4,y+2,w-8,4);
 if(isPlayer){ctx.fillStyle='#fff';ctx.fillRect(x+w/2-2,y-8,4,8);}
}
function loop(){
 requestAnimationFrame(loop);
 ctx.fillStyle='#2e8b57';ctx.fillRect(0,0,360,520);
 ctx.fillStyle='#333';ctx.fillRect(30,0,300,520);
 ctx.fillStyle='#fff';
 roadY=(roadY+player.speed)%40;
 for(let i=-1;i<14;i++){ctx.fillRect(175, i*40+roadY, 6, 20);}
 ctx.fillStyle='#ffe600';ctx.fillRect(30,0,6,520);ctx.fillRect(324,0,6,520);
 if(!playing){ctx.fillStyle='#fff';ctx.font='bold 16px monospace';ctx.fillText('ESCOLHA SEU CARRO',70,260);return;}
 raceTime++;
 player.dist+=player.speed;
 if(keys['gas']||keys['ArrowUp']) player.speed=Math.min(9,player.speed+0.12);
 else if(keys['brake']||keys['ArrowDown']) player.speed=Math.max(0,player.speed-0.25);
 else player.speed=Math.max(2,player.speed-0.03);
 if(keys['left']||keys['ArrowLeft']) player.x-=5+player.speed*0.4
